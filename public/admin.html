<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Veritas Bingo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0f1a; color: #e0d5b7; font-family: 'Segoe UI', sans-serif; }
    header { background: #111827; border-bottom: 2px solid #c89b3c; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { color: #c89b3c; font-size: 1.2rem; }
    a { color: #4a7fc1; font-size: 0.85rem; text-decoration: none; }
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    section { background: #111827; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e2a40; }
    h2 { color: #c89b3c; margin-bottom: 14px; font-size: 1rem; letter-spacing: 0.03em; }
    h3 { color: #9ab8d8; font-size: 0.9rem; margin-bottom: 10px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    input, select { background: #0f1e3a; color: #e0d5b7; border: 1px solid #2a3a54; border-radius: 4px; padding: 8px 10px; font-size: 0.9rem; }
    input { flex: 1; min-width: 140px; }
    input:focus, select:focus { outline: none; border-color: #4a7fc1; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
    .btn-gold { background: #c89b3c; color: #0d0f1a; font-weight: bold; }
    .btn-gold:hover { background: #e0b84a; }
    .btn-red { background: #7a2020; color: #fff; }
    .btn-red:hover { background: #962626; }
    .btn-green { background: #1e5a2a; color: #6bff9e; }
    .btn-green:hover { background: #256b33; }
    .btn-blue { background: #1a3a6a; color: #9ab8d8; }
    .btn-blue:hover { background: #1e4480; }
    .btn-gray { background: #1e2a40; color: #9ab8d8; border: 1px solid #2a3a54; }
    .btn-gray:hover { background: #243050; }

    /* Event list */
    .event-list { display: flex; flex-direction: column; gap: 8px; }
    .event-item { background: #0f1e3a; border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; }
    .event-item:hover { border-color: #c89b3c44; }
    .event-item.selected { border-color: #c89b3c; }
    .ev-name { font-weight: bold; }
    .ev-meta { font-size: 0.75rem; color: #556; margin-top: 2px; }
    .status-badge { font-size: 0.7rem; padding: 2px 10px; border-radius: 10px; }
    .status-active { background: #1e5a2a; color: #6bff9e; }
    .status-ended { background: #2a2a2a; color: #888; }

    /* Edit event */
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media(max-width:600px) { .edit-grid { grid-template-columns: 1fr; } }
    .edit-field label { display: block; font-size: 0.75rem; color: #556; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .edit-field input { width: 100%; }

    /* Roster */
    .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media(max-width:600px) { .roster-grid { grid-template-columns: 1fr; } }
    .roster-team { background: #0a0f1e; border-radius: 6px; padding: 12px; border: 1px solid #1e2a40; }
    .roster-team h3 { margin-bottom: 8px; }
    .roster-team.t1 h3 { color: #4a7fc1; }
    .roster-team.t2 h3 { color: #c85a1a; }
    .member-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-height: 30px; }
    .member-row { display: flex; align-items: center; justify-content: space-between; background: #111827; border-radius: 4px; padding: 5px 8px; font-size: 0.85rem; }
    .member-remove { background: none; border: none; color: #7a2020; cursor: pointer; font-size: 1rem; padding: 0 4px; }
    .member-remove:hover { color: #c03030; }
    .add-member-row { display: flex; gap: 6px; }
    .add-member-row input { flex: 1; }

    /* Board editor */
    .board-grid { display: grid; gap: 4px; margin-bottom: 12px; }
    .grid-cell { background: #0a0f1e; border: 2px solid #1e2a40; border-radius: 4px; min-height: 80px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.75rem; gap: 3px; transition: border-color 0.2s; }
    .grid-cell:hover { border-color: #c89b3c66; }
    .grid-cell.filled { border-color: #c89b3c55; background: #0f1a2e; }
    .cell-name { color: #c89b3c; font-weight: bold; }
    .cell-items { color: #556; font-size: 0.65rem; }

    /* Tile modal */
    .tile-editor-modal { display:none; position:fixed; inset:0; background:#000b; backdrop-filter:blur(3px); z-index:100; align-items:center; justify-content:center; }
    .tile-editor-modal.open { display:flex; }
    .modal-box { background:#111827; border:1px solid #2a3a54; border-top:2px solid #c89b3c; border-radius:10px; padding:24px; width:90%; max-width:440px; }
    .modal-box h3 { color:#c89b3c; margin-bottom:14px; }
    .form-group { margin-bottom:10px; }
    .form-group label { display:block; font-size:0.75rem; color:#556; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.05em; }
    .form-group input { width:100%; }
    .items-list { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
    .item-row { display:flex; gap:6px; }
    .item-row input { flex:1; }
    .modal-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

    /* Submissions */
    .submissions-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    .submissions-table th { text-align:left; color:#556; padding:6px 8px; border-bottom:1px solid #1e2a40; }
    .submissions-table td { padding:6px 8px; border-bottom:1px solid #141c2e; vertical-align:top; }
    .submissions-table img { width:60px; height:40px; object-fit:cover; border-radius:3px; cursor:pointer; }
    .sub-approved { background:#1e5a2a; color:#6bff9e; font-size:0.7rem; padding:2px 6px; border-radius:10px; }
    .sub-rejected { background:#5a1e1e; color:#ff8888; font-size:0.7rem; padding:2px 6px; border-radius:10px; }

    #img-preview-modal { display:none; position:fixed; inset:0; background:#000d; z-index:200; align-items:center; justify-content:center; cursor:pointer; }
    #img-preview-modal.open { display:flex; }
    #img-preview-modal img { max-width:90vw; max-height:90vh; border-radius:8px; border:2px solid #c89b3c; }

    .section-actions { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .save-notice { font-size:0.8rem; color:#50c878; margin-left:8px; }
    .error-notice { font-size:0.8rem; color:#e05050; margin-left:8px; }
  </style>
</head>
<body>
<header>
  <h1>⚙️ Veritas Bingo — Admin</h1>
  <a href="/">← Back to Board</a>
</header>

<div class="container">

  <!-- Create Event -->
  <section>
    <h2>Create New Event</h2>
    <div class="form-row">
      <input type="text" id="ev-name" placeholder="Event name">
      <input type="text" id="ev-codeword" placeholder="Code word">
      <input type="text" id="ev-t1" placeholder="Team 1 name">
      <input type="text" id="ev-t2" placeholder="Team 2 name">
      <button class="btn btn-gold" onclick="submitNewEvent()">Create Event</button>
    </div>
    <div id="create-status" style="font-size:0.8rem;"></div>
  </section>

  <!-- Events List -->
  <section>
    <h2>Events — click to manage</h2>
    <div class="event-list" id="event-list">Loading...</div>
  </section>

  <!-- Edit Event (shown when selected) -->
  <section id="edit-section" style="display:none">
    <h2>Edit Event — <span id="edit-event-name"></span></h2>
    <div class="section-actions">
      <button class="btn btn-green" onclick="activateEvent()">Set Active</button>
      <button class="btn btn-red" onclick="endEvent()">End Event</button>
      <span id="edit-status" class="save-notice"></span>
    </div>
    <div class="edit-grid">
      <div class="edit-field">
        <label>Event Name</label>
        <input type="text" id="edit-name">
      </div>
      <div class="edit-field">
        <label>Code Word</label>
        <input type="text" id="edit-codeword">
      </div>
      <div class="edit-field">
        <label>Team 1 Name</label>
        <input type="text" id="edit-t1">
      </div>
      <div class="edit-field">
        <label>Team 2 Name</label>
        <input type="text" id="edit-t2">
      </div>
    </div>
    <div style="margin-top:10px;">
      <button class="btn btn-gold" onclick="saveEventEdits()">Save Changes</button>
    </div>
  </section>

  <!-- Team Roster -->
  <section id="roster-section" style="display:none">
    <h2>Team Roster</h2>
    <div class="roster-grid">
      <div class="roster-team t1">
        <h3 id="roster-t1-name">Team 1</h3>
        <div class="member-list" id="roster-t1-list"></div>
        <div class="add-member-row">
          <input type="text" id="add-t1-name" placeholder="Player RSN" maxlength="12">
          <button class="btn btn-blue" onclick="addMember(1)">Add</button>
        </div>
      </div>
      <div class="roster-team t2">
        <h3 id="roster-t2-name">Team 2</h3>
        <div class="member-list" id="roster-t2-list"></div>
        <div class="add-member-row">
          <input type="text" id="add-t2-name" placeholder="Player RSN" maxlength="12">
          <button class="btn btn-blue" onclick="addMember(2)">Add</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Board Editor -->
  <section id="board-section" style="display:none">
    <h2>Board Editor — <span id="board-event-name"></span></h2>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;">
      <label style="font-size:0.85rem;color:#556;">Grid:</label>
      <select id="grid-rows" onchange="initGrid()">
        <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option>
      </select>
      <span style="color:#556;">×</span>
      <select id="grid-cols" onchange="initGrid()">
        <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option>
      </select>
      <small style="color:#445;margin-left:4px;">Click any cell to add/edit a tile</small>
    </div>
    <div class="board-grid" id="board-grid"></div>
  </section>

  <!-- Submissions -->
  <section id="submissions-section" style="display:none">
    <h2>Submissions</h2>
    <div id="submissions-content">Loading...</div>
  </section>

</div>

<!-- Login overlay -->
<div id="login-overlay" style="display:none;position:fixed;inset:0;background:#0d0f1aee;backdrop-filter:blur(6px);z-index:500;align-items:center;justify-content:center;">
  <div style="background:#111827;border:1px solid #2a3a54;border-top:2px solid #c89b3c;border-radius:10px;padding:32px;width:90%;max-width:360px;text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">⚔️</div>
    <h2 style="color:#c89b3c;font-size:1.1rem;margin-bottom:6px;">Admin Access</h2>
    <p style="color:#556;font-size:0.8rem;margin-bottom:20px;">Enter the admin password to continue.</p>
    <input type="password" id="login-password" placeholder="Password" style="width:100%;background:#0f1e3a;color:#e0d5b7;border:1px solid #2a3a54;border-radius:4px;padding:10px;font-size:1rem;margin-bottom:10px;" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-error" style="color:#e05050;font-size:0.8rem;min-height:1.2em;margin-bottom:10px;"></div>
    <button onclick="doLogin()" style="width:100%;background:#c89b3c;color:#0d0f1a;font-weight:bold;border:none;padding:10px;border-radius:4px;cursor:pointer;font-size:0.95rem;">Enter</button>
  </div>
</div>

<!-- Tile Editor Modal -->
<div class="tile-editor-modal" id="tile-modal">
  <div class="modal-box">
    <h3>Edit Tile — <span id="modal-pos"></span></h3>
    <div class="form-group">
      <label>Tile Name</label>
      <input type="text" id="modal-tile-name" placeholder="e.g. Barrows Armour">
    </div>
    <div class="form-group">
      <label>Required Items (one per line)</label>
      <div class="items-list" id="modal-items"></div>
      <button class="btn btn-gray" onclick="addItemRow()" style="font-size:0.8rem;padding:4px 10px;margin-top:4px;">+ Add Item</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeTileModal()">Cancel</button>
      <button class="btn btn-red" onclick="deleteTile()" id="modal-delete-btn">Delete</button>
      <button class="btn btn-gold" onclick="saveTile()">Save Tile</button>
    </div>
  </div>
</div>

<!-- Image preview -->
<div id="img-preview-modal" onclick="this.classList.remove('open')">
  <img id="img-preview" src="" alt="Screenshot">
</div>

<script>
let selectedEventId = null;
let selectedEventData = null;
let gridData = {};
let editingCell = null;
let adminPassword = localStorage.getItem('adminPassword') || '';

// ── Auth ─────────────────────────────────────────────────

function adminFetch(url, opts = {}) {
  opts.headers = { ...(opts.headers || {}), 'x-admin-password': adminPassword };
  return fetch(url, opts);
}

async function checkAuth() {
  const res = await fetch('/api/admin/events', { headers: { 'x-admin-password': adminPassword } });
  if (res.status === 401) {
    showLogin();
    return false;
  }
  return true;
}

function showLogin() {
  document.getElementById('login-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('login-password').focus(), 50);
}

async function doLogin() {
  const pw = document.getElementById('login-password').value;
  const res = await fetch('/api/admin/events', { headers: { 'x-admin-password': pw } });
  if (res.status === 401) {
    document.getElementById('login-error').textContent = 'Incorrect password.';
    return;
  }
  adminPassword = pw;
  localStorage.setItem('adminPassword', pw);
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
  loadEvents();
}

// ── Events ──────────────────────────────────────────────

async function loadEvents() {
  try {
    const res = await adminFetch('/api/admin/events');
    const events = await res.json();
    const el = document.getElementById('event-list');
    if (!events.length) { el.textContent = 'No events yet.'; return; }
    el.innerHTML = '';
    events.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'event-item' + (String(ev.id) === String(selectedEventId) ? ' selected' : '');
      div.innerHTML = `
        <div>
          <div class="ev-name">${escHtml(ev.name)}</div>
          <div class="ev-meta">Code word: <b>${escHtml(ev.code_word)}</b> &nbsp;·&nbsp; ${escHtml(ev.team1_name)} vs ${escHtml(ev.team2_name)}</div>
        </div>
        <span class="status-badge status-${ev.status}">${ev.status}</span>
      `;
      div.onclick = () => selectEvent(ev);
      el.appendChild(div);
    });
  } catch (err) {
    document.getElementById('event-list').textContent = 'Failed to load events.';
  }
}

async function submitNewEvent() {
  const name = document.getElementById('ev-name').value.trim();
  const code_word = document.getElementById('ev-codeword').value.trim();
  const team1_name = document.getElementById('ev-t1').value.trim() || 'Team 1';
  const team2_name = document.getElementById('ev-t2').value.trim() || 'Team 2';
  const statusEl = document.getElementById('create-status');
  if (!name || !code_word) {
    statusEl.style.color = '#e05050'; statusEl.textContent = 'Event name and code word are required.'; return;
  }
  statusEl.style.color = '#888'; statusEl.textContent = 'Creating...';
  try {
    const res = await adminFetch('/api/admin/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, code_word, team1_name, team2_name })
    });
    const data = await res.json();
    if (data.id) {
      statusEl.style.color = '#50c878'; statusEl.textContent = `"${name}" created!`;
      document.getElementById('ev-name').value = '';
      document.getElementById('ev-codeword').value = '';
      loadEvents();
    } else {
      statusEl.style.color = '#e05050'; statusEl.textContent = data.error || 'Something went wrong.';
    }
  } catch (err) {
    statusEl.style.color = '#e05050'; statusEl.textContent = 'Network error.';
  }
}

async function selectEvent(ev) {
  selectedEventId = ev.id;
  selectedEventData = ev;

  // Show all management sections
  document.getElementById('edit-section').style.display = 'block';
  document.getElementById('roster-section').style.display = 'block';
  document.getElementById('board-section').style.display = 'block';
  document.getElementById('submissions-section').style.display = 'block';

  // Populate edit fields
  document.getElementById('edit-event-name').textContent = ev.name;
  document.getElementById('edit-name').value = ev.name;
  document.getElementById('edit-codeword').value = ev.code_word;
  document.getElementById('edit-t1').value = ev.team1_name;
  document.getElementById('edit-t2').value = ev.team2_name;
  document.getElementById('board-event-name').textContent = ev.name;

  // Roster labels
  document.getElementById('roster-t1-name').textContent = ev.team1_name;
  document.getElementById('roster-t2-name').textContent = ev.team2_name;

  document.querySelectorAll('.event-item').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.event-item').forEach(el => {
    if (el.querySelector('.ev-name')?.textContent === ev.name) el.classList.add('selected');
  });

  await loadBoardData();
  initGrid();
  loadMembers();
  loadSubmissions();
}

async function saveEventEdits() {
  const statusEl = document.getElementById('edit-status');
  const name = document.getElementById('edit-name').value.trim();
  const code_word = document.getElementById('edit-codeword').value.trim();
  const team1_name = document.getElementById('edit-t1').value.trim();
  const team2_name = document.getElementById('edit-t2').value.trim();
  if (!name || !code_word) { statusEl.className = 'error-notice'; statusEl.textContent = 'Name and code word required.'; return; }
  try {
    await adminFetch(`/api/admin/events/${selectedEventId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, code_word, team1_name, team2_name })
    });
    statusEl.className = 'save-notice'; statusEl.textContent = 'Saved!';
    document.getElementById('edit-event-name').textContent = name;
    document.getElementById('board-event-name').textContent = name;
    document.getElementById('roster-t1-name').textContent = team1_name;
    document.getElementById('roster-t2-name').textContent = team2_name;
    selectedEventData = { ...selectedEventData, name, code_word, team1_name, team2_name };
    loadEvents();
    setTimeout(() => { statusEl.textContent = ''; }, 2000);
  } catch (err) {
    statusEl.className = 'error-notice'; statusEl.textContent = 'Save failed.';
  }
}

async function activateEvent() {
  await adminFetch(`/api/admin/events/${selectedEventId}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'active' })
  });
  loadEvents();
}

async function endEvent() {
  if (!confirm('End this event?')) return;
  await adminFetch(`/api/admin/events/${selectedEventId}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'ended' })
  });
  loadEvents();
}

// ── Roster ───────────────────────────────────────────────

async function loadMembers() {
  try {
    const res = await adminFetch(`/api/admin/events/${selectedEventId}/members`);
    const members = await res.json();
    const t1 = members.filter(m => m.team === 1);
    const t2 = members.filter(m => m.team === 2);
    renderMemberList('roster-t1-list', t1);
    renderMemberList('roster-t2-list', t2);
  } catch {}
}

function renderMemberList(elId, members) {
  const el = document.getElementById(elId);
  if (!members.length) { el.innerHTML = '<div style="color:#445;font-size:0.8rem;">No players yet.</div>'; return; }
  el.innerHTML = members.map(m => `
    <div class="member-row">
      <span>${escHtml(m.player_name)}</span>
      <button class="member-remove" onclick="removeMember(${m.id})">✕</button>
    </div>
  `).join('');
}

async function addMember(team) {
  const inputId = team === 1 ? 'add-t1-name' : 'add-t2-name';
  const name = document.getElementById(inputId).value.trim();
  if (!name) return;
  const res = await adminFetch(`/api/admin/events/${selectedEventId}/members`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player_name: name, team })
  });
  const data = await res.json();
  if (data.id) {
    document.getElementById(inputId).value = '';
    loadMembers();
  } else {
    alert(data.error || 'Could not add player.');
  }
}

async function removeMember(memberId) {
  await adminFetch(`/api/admin/events/${selectedEventId}/members/${memberId}`, { method: 'DELETE' });
  loadMembers();
}

// ── Board editor ─────────────────────────────────────────

async function loadBoardData() {
  try {
    const res = await fetch(`/api/events/${selectedEventId}/tiles`);
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const tiles = await res.json();
    gridData = {};
    tiles.forEach(t => { gridData[`${t.row}_${t.col}`] = t; });
  } catch (err) {
    console.error('loadBoardData failed:', err.message);
    gridData = {};
  }
}

function initGrid() {
  const rows = parseInt(document.getElementById('grid-rows').value);
  const cols = parseInt(document.getElementById('grid-cols').value);
  const grid = document.getElementById('board-grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const tile = gridData[`${r}_${c}`];
      const cell = document.createElement('div');
      cell.className = 'grid-cell' + (tile ? ' filled' : '');
      cell.innerHTML = tile
        ? `<div class="cell-name">${escHtml(tile.tile_name)}</div><div class="cell-items">${(tile.items||[]).map(i => escHtml(i.item_name)).join(', ')}</div>`
        : `<div style="color:#2a3a54;font-size:1.4rem;">+</div>`;
      cell.onclick = () => openTileModal(r, c, tile);
      grid.appendChild(cell);
    }
  }
}

function openTileModal(row, col, tile) {
  editingCell = { row, col, tile };
  document.getElementById('modal-pos').textContent = `row ${row}, col ${col}`;
  document.getElementById('modal-tile-name').value = tile ? tile.tile_name : '';
  document.getElementById('modal-delete-btn').style.display = tile ? 'inline-block' : 'none';
  const itemsList = document.getElementById('modal-items');
  itemsList.innerHTML = '';
  const items = tile?.items?.length ? tile.items : [];
  if (items.length) items.forEach(item => addItemRow(item.item_name));
  else addItemRow('');
  document.getElementById('tile-modal').classList.add('open');
}

function addItemRow(value = '') {
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `<input type="text" placeholder="Item name" value="${escHtml(value)}"><button class="btn btn-gray" onclick="this.parentElement.remove()" style="padding:4px 8px;flex-shrink:0;">✕</button>`;
  document.getElementById('modal-items').appendChild(row);
}

function closeTileModal() { document.getElementById('tile-modal').classList.remove('open'); }

async function saveTile() {
  const { row, col } = editingCell;
  const tileName = document.getElementById('modal-tile-name').value.trim();
  const items = Array.from(document.querySelectorAll('#modal-items .item-row input'))
    .map(i => i.value.trim()).filter(Boolean);
  if (!tileName) { alert('Tile name required.'); return; }
  if (!items.length) { alert('At least one item required.'); return; }
  try {
    const res = await adminFetch(`/api/admin/events/${selectedEventId}/tiles`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ row, col, tile_name: tileName, items })
    });
    const data = await res.json();
    if (!data.tileId) { alert(data.error || 'Save failed.'); return; }
    closeTileModal();
    await loadBoardData();
    initGrid();
  } catch (err) {
    alert('Network error saving tile.');
  }
}

async function deleteTile() {
  if (!editingCell.tile) return;
  if (!confirm('Delete this tile?')) return;
  await adminFetch(`/api/admin/events/${selectedEventId}/tiles/${editingCell.tile.id}`, { method: 'DELETE' });
  closeTileModal();
  await loadBoardData();
  initGrid();
}

// ── Submissions ───────────────────────────────────────────

async function loadSubmissions() {
  try {
    const res = await adminFetch(`/api/admin/events/${selectedEventId}/submissions`);
    const subs = await res.json();
    const el = document.getElementById('submissions-content');
    if (!subs.length) { el.textContent = 'No submissions yet.'; return; }
    el.innerHTML = `
      <table class="submissions-table">
        <thead><tr><th>Player</th><th>Team</th><th>Tile</th><th>Item</th><th>Screenshot</th><th>Status</th><th>Time</th></tr></thead>
        <tbody>${subs.map(s => `
          <tr>
            <td>${escHtml(s.player_name)}</td>
            <td>Team ${s.team}</td>
            <td>${escHtml(s.tile_name)}</td>
            <td>${escHtml(s.item_name)}</td>
            <td><img src="/${escHtml(s.screenshot_path)}" onclick="previewImg(this.src)" alt="screenshot"></td>
            <td><span class="sub-${s.status}">${s.status}</span></td>
            <td style="font-size:0.75rem;color:#556;">${new Date(s.created_at + 'Z').toLocaleString()}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch {}
}

function previewImg(src) {
  document.getElementById('img-preview').src = src;
  document.getElementById('img-preview-modal').classList.add('open');
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

checkAuth().then(ok => { if (ok) loadEvents(); });
</script>
